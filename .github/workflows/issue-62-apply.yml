name: Issue 62 Apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/62-character-suggestions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python .github/issue62_apply.py
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Commit implementation and remove runner
        run: |
          rm .github/issue62_apply.py .github/workflows/issue-62-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add character assignment suggestions (#62)"
          git push
