name: Issue 81 Apply

on:
  push:
    branches:
      - feat/81-low-confidence-one-off

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python .github/issue81_apply.py
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Cleanup helper files
        run: rm -f .github/issue81_apply.py .github/workflows/issue-81-apply.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: mark one-off folders low-confidence" || exit 0
          git push
