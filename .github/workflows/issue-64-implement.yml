name: Issue 64 implementation
on:
  push:
    branches: [feat/64-visual-canon-wiring]
permissions:
  contents: write
jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[issue-64-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/64-visual-canon-wiring
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply issue 64 integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"replacement target not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # VS Code integration: repository-backed reader, watcher, details state, and generation wiring.
          replace_once('src/extension.ts',
          'import { DebouncedAction } from "./core/debouncedAction";\n',
          'import { DebouncedAction } from "./core/debouncedAction";\nimport { VISUAL_CANON_PATH } from "./core/visualCanon";\n')
          replace_once('src/extension.ts',
          'import { filterWorkspaceAssets, getWorkspaceAssetIdentity, WorkspaceAsset } from "./workspaceAsset";\n',
          'import {\n  loadWorkspaceVisualCanonForAsset,\n  resolveUnambiguousWorkspaceVisualCanon,\n  type WorkspaceVisualCanonReader,\n} from "./visualCanonWorkspace";\nimport { filterWorkspaceAssets, getWorkspaceAssetIdentity, WorkspaceAsset } from "./workspaceAsset";\n')
          replace_once('src/extension.ts',
          '  const scanAndStore = async (showMessage: boolean): Promise<WorkspaceAsset[]> => {\n',
          '''  const visualCanonReader: WorkspaceVisualCanonReader = {\n    read: async (workspaceFolderUri) => {\n      const canonUri = vscode.Uri.joinPath(vscode.Uri.parse(workspaceFolderUri), VISUAL_CANON_PATH);\n      try {\n        return new TextDecoder().decode(await vscode.workspace.fs.readFile(canonUri));\n      } catch (error) {\n        if (isFileNotFound(error)) {\n          return undefined;\n        }\n        throw error;\n      }\n    },\n  };\n\n  const scanAndStore = async (showMessage: boolean): Promise<WorkspaceAsset[]> => {\n''')
          replace_once('src/extension.ts',
          '''      watcherDisposables.push(\n        metadataWatcher,\n        metadataWatcher.onDidCreate(onMetadataEvent),\n        metadataWatcher.onDidChange(onMetadataEvent),\n        metadataWatcher.onDidDelete(onMetadataEvent),\n      );\n''',
          '''      watcherDisposables.push(\n        metadataWatcher,\n        metadataWatcher.onDidCreate(onMetadataEvent),\n        metadataWatcher.onDidChange(onMetadataEvent),\n        metadataWatcher.onDidDelete(onMetadataEvent),\n      );\n\n      const visualCanonWatcher = vscode.workspace.createFileSystemWatcher(\n        new vscode.RelativePattern(workspaceFolder, VISUAL_CANON_PATH),\n      );\n      const onVisualCanonEvent = (): void => watcherRefresh?.trigger();\n      watcherDisposables.push(\n        visualCanonWatcher,\n        visualCanonWatcher.onDidCreate(onVisualCanonEvent),\n        visualCanonWatcher.onDidChange(onVisualCanonEvent),\n        visualCanonWatcher.onDidDelete(onVisualCanonEvent),\n      );\n''')
          replace_once('src/extension.ts',
          '''        const details = await loadAssetDetails(workspaceAsset.asset);\n        return {\n          ...details,\n          workspaceAsset,\n        };\n''',
          '''        const details = await loadAssetDetails(workspaceAsset.asset);\n        try {\n          const visualCanon = await loadWorkspaceVisualCanonForAsset(workspaceAsset, visualCanonReader);\n          return {\n            ...details,\n            workspaceAsset,\n            visualCanon: { memberships: visualCanon.memberships },\n          };\n        } catch (error) {\n          return {\n            ...details,\n            workspaceAsset,\n            visualCanon: { memberships: [], error: formatError(error) },\n          };\n        }\n''')
          replace_once('src/extension.ts',
          '''        activeVariantAsset = workspaceAsset;\n        try {\n          return await variantWorkflow.start(workspaceAsset, input);\n''',
          '''        activeVariantAsset = workspaceAsset;\n        try {\n          const visualCanonState = await loadWorkspaceVisualCanonForAsset(workspaceAsset, visualCanonReader);\n          const visualCanon = resolveUnambiguousWorkspaceVisualCanon(\n            workspaceAsset,\n            visualCanonState,\n            discoveredAssets,\n          );\n          return await variantWorkflow.start(workspaceAsset, { ...input, visualCanon });\n''')

          # Asset Details presentation only; no authoring controls.
          replace_once('src/ui/assetGridPanel.ts',
          'import { type VariantReviewView } from "../variantReviewController";\n',
          'import { type VariantReviewView } from "../variantReviewController";\nimport { type VisualCanonMembership } from "../visualCanonWorkspace";\n')
          replace_once('src/ui/assetGridPanel.ts',
          '  | { status: "available"; workspaceAsset: WorkspaceAsset; details: AssetDetails }\n',
          '  | { status: "available"; workspaceAsset: WorkspaceAsset; details: AssetDetails; visualCanon?: { memberships: VisualCanonMembership[]; error?: string } }\n')
          replace_once('src/ui/assetGridPanel.ts',
          '''      addCharacterControl(result.workspaceAsset.character, selectedIdentity ? characterSuggestions[selectedIdentity] : undefined);\n      addDetailRow('Format', asset.fileType.toUpperCase());\n''',
          '''      addCharacterControl(result.workspaceAsset.character, selectedIdentity ? characterSuggestions[selectedIdentity] : undefined);\n      addVisualCanonDetails(result.visualCanon);\n      addDetailRow('Format', asset.fileType.toUpperCase());\n''')
          replace_once('src/ui/assetGridPanel.ts',
          '''    function addAssetTypeControl(currentType) {\n''',
          '''    function addVisualCanonDetails(state) {\n      if (!state) {\n        addDetailRow('Visual Canon', 'None');\n        return;\n      }\n      if (state.error) {\n        addDetailRow('Visual Canon', 'Invalid · ' + state.error);\n        return;\n      }\n      const memberships = Array.isArray(state.memberships) ? state.memberships : [];\n      if (memberships.length === 0) {\n        addDetailRow('Visual Canon', 'No membership');\n        return;\n      }\n      const prefix = memberships.length === 1 ? '1 membership · ' : memberships.length + ' memberships · ';\n      addDetailRow('Visual Canon', prefix + memberships.map((membership) => membership.id + ' [' + membership.kind + '] · anchor').join(', '));\n    }\n\n    function addAssetTypeControl(currentType) {\n''')

          # Architecture now documents the implemented, bounded Canon integration instead of listing it as deferred.
          replace_once('docs/architecture.md',
          'This flow does not define Visual Canon, persisted lineage, replace/edit transactions, provider selection UI, or rejected-candidate storage.\n',
          '''Visual Canon is an optional repository-backed constraint layer stored at `.game-asset-explorer/visual-canon.json`. It describes semantic identity/style constraints while the filesystem remains authoritative for whether anchors exist. Asset Details may show Canon membership, and Generate Variant may consume Canon context only when the selected asset belongs to exactly one entry and every required anchor exists in that same workspace. Invalid Canon, missing anchors, or ambiguous membership fail closed before provider invocation. Canon authoring UI, automatic inference, and persisted generation lineage remain out of scope.\n\nThis flow does not define persisted lineage, replace/edit transactions, provider selection UI, or rejected-candidate storage.\n''')
          replace_once('docs/architecture.md', '\n- Visual Canon\n', '\n')
          PY
      - name: Run tests
        run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/issue-64-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/extension.ts src/ui/assetGridPanel.ts docs/architecture.md .github/workflows/issue-64-implement.yml
          git commit -m "Wire Visual Canon into Asset Details and generation [issue-64-done]"
          git push origin HEAD:feat/64-visual-canon-wiring
