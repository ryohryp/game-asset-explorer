name: Apply Issue 54

on:
  push:
    branches:
      - feat/54-character-view

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/54-character-view
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python .github/issue54_apply.py
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/issue54_apply.py .github/workflows/issue-54-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add character-centric asset grouping and view (#54)"
          git push origin HEAD:feat/54-character-view
