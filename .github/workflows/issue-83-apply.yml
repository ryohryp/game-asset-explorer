name: Issue 83 Apply

on:
  push:
    branches:
      - feat/83-folder-intent-evidence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/83-folder-intent-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        run: python .github/scripts/issue83.py
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Cleanup helper files
        run: git rm .github/scripts/issue83.py .github/workflows/issue-83-apply.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "feat: surface folder intent evidence"
          git push origin HEAD:feat/83-folder-intent-evidence
