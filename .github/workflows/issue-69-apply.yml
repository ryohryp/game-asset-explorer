name: Issue 69 Apply

on:
  push:
    branches:
      - feat/69-folder-organization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/69-folder-organization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python .github/issue69_apply.py
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Commit implementation and remove runner
        run: |
          rm .github/issue69_apply.py .github/workflows/issue-69-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add folder organization analysis (#69)"
          git push
